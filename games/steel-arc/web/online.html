<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071722"><meta name="description" content="钢铁远征好友房">
<title>钢铁远征 · 好友房</title><link rel="stylesheet" href="./online.css">
<link rel="stylesheet" href="./tutorial.css">
</head>
<body><main class="shell">
<header class="masthead"><a href="/" class="back">返回大厅</a><div class="brand"><b><i>钢铁</i>远征</b><small>STEEL EXPEDITION / FRIEND ROOM</small></div><a href="./index.html" class="solo">单人战役</a></header>
<section id="entry" class="entry-stage"><div class="entry-copy"><span class="serial">OPEN TABLETOP / GAME 06</span><h1>钢铁远征<br><em>好友房</em></h1><div class="order-preview"><b>A1</b><i>→</i><b>B1</b><i>→</i><b>A2</b><i>→</i><b>B2</b></div></div>
<form class="entry-panel" onsubmit="return false"><span class="panel-kicker">FRIEND ROOM</span><h2>进入战区</h2><label>你的昵称<input id="name" maxlength="16" value="指挥官" autocomplete="nickname"></label><button id="create" class="primary" type="button">创建好友房</button><div class="divider"><span>或使用房间码</span></div><div class="join"><input id="code" maxlength="6" placeholder="六位房间码" autocomplete="off"><button id="join" type="button">加入</button></div></form></section>
<section id="lobby" class="lobby-stage" hidden><div class="room-brief"><span class="panel-kicker">DEPLOYMENT</span><h1>战前部署</h1><div class="room-code"><span>房间码</span><strong id="room-code">------</strong><button id="copy" type="button">复制邀请</button></div><div class="lobby-actions"><button id="ready" type="button">准备</button><button id="start" class="primary" type="button" disabled>开始战斗</button><button id="leave" type="button">离开</button></div><p id="hint" class="hint">等待好友加入</p></div><div class="deployment-board"><div class="team-label team-a"><b>A 队</b><span>左侧阵地</span></div><div class="team-label team-b"><b>B 队</b><span>右侧阵地</span></div><div id="roster" class="roster"></div><div class="turn-rail"><span>行动顺序</span><b>A1</b><i>→</i><b>B1</b><i>→</i><b>A2</b><i>→</i><b>B2</b></div></div></section>
<section id="battle" class="battle-stage" hidden aria-label="好友房战斗"><canvas id="battlefield" width="1280" height="720"></canvas><div class="battle-top"><div id="team-a-status" class="team-status a"></div><div class="turn-badge"><small id="round">第 1 轮</small><strong id="turn">A1</strong><span id="countdown">行动中</span></div><div id="team-b-status" class="team-status b"></div><button id="battle-leave" class="exit-battle" type="button" aria-label="离开战斗">×</button></div><div id="turn-order" class="battle-order"></div><div id="aim-panel" class="aim-panel"><button id="aim-control" class="aim-control" type="button" aria-label="瞄准"><span class="cross x"></span><span class="cross y"></span><span id="shot-vector" class="shot-vector"></span><span id="pull-vector" class="pull-vector"></span><span class="anchor"></span><i id="aim-knob"></i><span class="aim-readout"><b id="angle-value">45°</b><i>·</i><b id="power-value">68</b></span><span class="aim-hint">瞄准</span></button></div><div class="command-deck"><div class="fuel"><span>履带燃料</span><b id="fuel-value">88</b><div><i id="fuel-bar"></i></div><small>移动</small></div><div id="weapon-rack" class="weapon-rack"></div><button id="fire" class="fire" type="button"><strong>开火</strong><small id="fire-state">等待行动</small></button></div><aside class="battle-log"><b>战况</b><p id="log"></p></aside><div id="intro-label" class="intro-label" hidden>战场侦察</div><div id="result" class="result" hidden><span>战斗结束</span><strong id="winner"></strong><button id="result-leave" type="button">返回大厅</button></div></section><p id="error" class="error" role="alert"></p></main><script type="module" src="./online.js"></script></body></html>
